name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium==4.38.0
      - run: python -m unittest discover -s tests -v
  credentials:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./tests/Test-CredentialStore.ps1
      - shell: powershell
        run: ./scripts/Check-Release.ps1
